name: Manual Approval example

on:
  push:
    branches:
      - 'test-manual-approval'

jobs:
  manual-approval:
    runs-on: ubuntu-latest
    outputs:
      approval-status: ${{ steps.manual-approval.outputs.approval-status }}
      issue-url: ${{ steps.manual-approval.outputs.issue-url }}
      issue-number: ${{ steps.manual-approval.outputs.issue-number }}


    steps:
      - name: Get 'Harbor Systems Bot' access token for organization
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.LIGHTNING_MACLEAN_APP_ID }}
          private-key: ${{ secrets.LIGHTNING_MACLEAN_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }} # lizziemac
      - name: Manual approval
        id: manual-approval
        uses: lizziemac/manual-approval@test/feat-outputs
        timeout-minutes: 1
        with:
          secret: ${{ steps.app-token.outputs.token }}
          approvers: lizziemac
          issue-title: "Ka-chow - ${{ github.run_id }}"
          minimum-approvals: 1

  validate:
    needs: manual-approval
    runs-on: ubuntu-latest
    steps:
      - name: Check outputs
        run: |
          echo "${{ needs.manual-approval.outputs.approval-status }}"
          echo "${{ needs.manual-approval.outputs.issue-number }}"
          echo "${{ needs.manual-approval.outputs.issue-url }}"
